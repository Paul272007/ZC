name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-format:
    name: Code Hygiene & Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        uses: wagoid/commitlint-github-action@v6

  build-and-test:
    name: Build & Test (Linux Clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install LLVM 21 & dependencies
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y \
            clang-21 \
            clang-tidy-21 \
            clang-format-21 \
            libclang-rt-21-dev \
            libstdc++-14-dev \
            ninja-build \
            libarchive-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            nlohmann-json3-dev
          sudo ln -sf /usr/bin/clang-21 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-21 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/clang-21 /usr/local/bin/cc
          sudo ln -sf /usr/bin/clang++-21 /usr/local/bin/c++
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          /usr/bin/clang-21 --version
          /usr/bin/clang++-21 --version

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-${{ github.ref }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Configure CMake
        run: |
          cmake --preset debug \
            -DCMAKE_C_COMPILER=/usr/bin/clang-21 \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++-21 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Run C++ Linter
        uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: '21'
          style: 'file'
          tidy-checks: 'file'
          database: 'build'
          extensions: 'c,cpp,h,hpp'
          ignore: 'build'

      - name: Build
        run: cmake --build --preset debug

      - name: Run tests
        run: ctest --preset debug
